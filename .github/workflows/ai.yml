name: AI validation

on:
  push:
    branches: [master]
    paths: ['ts-redalert2/**', '.github/workflows/ai.yml', '.github/scripts/**', 'docs/ai-vanilla-evaluation-plan.json']
  pull_request:
    paths: ['ts-redalert2/**', '.github/workflows/ai.yml', '.github/scripts/**', 'docs/ai-vanilla-evaluation-plan.json']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run all 432 country games
        type: boolean
        default: true
      baseline_ref:
        description: Frozen baseline bot commit
        type: string
        default: '04a9f7a'
      candidate_ref:
        description: Frozen candidate bot commit (empty uses this workflow commit)
        type: string
        default: ''
      baseline_profile:
        description: Baseline bot strategy (use normal for the original 14ffd36 bot)
        type: choice
        options: [brutal, normal]
        default: brutal
      evaluation_set:
        description: Preregistered map seeds (do not tune on qualification results)
        type: choice
        options: [regression, development, qualification_a, qualification_b, qualification_c]
        default: regression
      comparison_mode:
        description: Historical strength gates or direct current-bot screening
        type: choice
        options: [historical, direct]
        default: historical
      tactic_schedule:
        description: P1 direct C18 tactic screen, including mirrored Soviet countries
        type: choice
        options: [none, pilot, development]
        default: none

permissions:
  contents: read

concurrency:
  group: ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: '1.3.14'
  RA2_BENCHMARK_CDN: ${{ github.workspace }}/.cache/ai-resources/cdn
  AI_BASELINE_REF: ${{ inputs.baseline_ref || '04a9f7a' }}
  AI_CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
  AI_BASELINE_PROFILE: ${{ inputs.baseline_profile || 'brutal' }}
  AI_EVALUATION_SET: ${{ inputs.evaluation_set || 'regression' }}
  AI_COMPARISON_MODE: ${{ inputs.comparison_mode || 'historical' }}
  AI_TACTIC_SCHEDULE: ${{ inputs.tactic_schedule || 'none' }}
  AI_TOURNAMENT_WORKERS: ${{ github.event.repository.private && '2' || '4' }}

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: ts-redalert2
        run: bun install --frozen-lockfile
      - name: Validate report integrity checks
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/cache@v4
        with:
          path: .cache/ai-resources/cdn
          key: ai-resources-541828fa-${{ hashFiles('ts-redalert2/deploy/prepare-resources.ts') }}
      - name: Prepare real game resources
        run: |
          command -v 7z >/dev/null || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
          bash .github/scripts/prepare-ai-resources.sh
      - name: Regression and real-engine mechanism tests
        working-directory: ts-redalert2
        run: |
          mkdir -p /tmp/opencode
          bun test
          bun run typecheck:entry
          bun run typecheck:server
          bun --bun tsc -p e2e/tsconfig.ai-benchmark.json
          bun --bun tsc -p e2e/tsconfig.ai-sneak-capture-scenario.json
          bun --bun tsc -p e2e/tsconfig.ai-rhino-dog-scenario.json
          bun run build
          bun e2e/ai-harassment-scenario.ts --out .artifacts/ai-ci/harassment.json
          bun e2e/ai-sneak-capture-scenario.ts --out .artifacts/ai-ci/sneak-capture.json
          bun e2e/ai-rhino-dog-scenario.ts --out .artifacts/ai-ci/rhino-dog-fixtures.json
          bun e2e/ai-tournament.ts --candidate-ref "$AI_CANDIDATE_REF" --baseline-ref "$AI_BASELINE_REF" \
            --baseline-profile "$AI_BASELINE_PROFILE" \
            --countries Americans,Russians --scenarios mp08t2:909 --max-ticks 3000 \
            --concurrency 2 --out .artifacts/ai-ci/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-regression
          path: ts-redalert2/.artifacts/ai-ci/
          retention-days: 14

  tactic-screen:
    needs: regression
    if: github.event_name == 'workflow_dispatch' && inputs.tactic_schedule && inputs.tactic_schedule != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: short
            map: mp08t2
          - id: medium
            map: tn01t2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .cache/ai-resources/cdn
          key: ai-resources-541828fa-${{ hashFiles('ts-redalert2/deploy/prepare-resources.ts') }}
      - name: Prepare resources and dependencies
        run: |
          command -v 7z >/dev/null || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
          cd ts-redalert2
          bun install --frozen-lockfile
          cd ..
          bash .github/scripts/prepare-ai-resources.sh
      - name: Direct normal-economy matches, preserving raw results
        working-directory: ts-redalert2
        env:
          AI_TACTIC_MAP: ${{ matrix.map }}
          AI_TACTIC_SHARD: ${{ matrix.id }}
        run: |
          if [ "$AI_TACTIC_SCHEDULE" = pilot ]; then
            tactic_seeds=610101
            tactic_pairs=Arabs:Arabs,Russians:Russians
          else
            tactic_seeds=610101,610202,610303
            tactic_pairs=Arabs:Arabs,Russians:Russians,Arabs:Russians,Russians:Arabs,Arabs:Americans,Russians:Americans,Americans:Arabs,Americans:Russians
          fi
          bun e2e/ai-benchmark.ts --candidate-ref "$AI_CANDIDATE_REF" --baseline-ref "$AI_BASELINE_REF" \
            --candidate-profile brutal --baseline-profile brutal --map "$AI_TACTIC_MAP" \
            --seeds "$tactic_seeds" --matchups "$tactic_pairs" --max-ticks 27000 --unit-details \
            --out ".artifacts/ai-tactic/raw-$AI_TACTIC_SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-tactic-raw-${{ matrix.id }}
          path: ts-redalert2/.artifacts/ai-tactic/
          retention-days: 30

  tactic-report:
    needs: tactic-screen
    if: always() && needs.tactic-screen.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-tactic-raw-*
          path: collected
      - name: Verify direct schedule and assess development signal
        run: |
          tactic_exit=0
          python -B .github/scripts/summarize-ai-tactic.py \
            collected/ai-tactic-raw-short/raw-short.json collected/ai-tactic-raw-medium/raw-medium.json \
            --candidate-ref "$AI_CANDIDATE_REF" --baseline-ref "$AI_BASELINE_REF" \
            --schedule "$AI_TACTIC_SCHEDULE" --out ai-tactic-report --require-positive || tactic_exit=$?
          if [ -f ai-tactic-report/report.md ]; then
            cat ai-tactic-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$tactic_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-tactic-report
          path: ai-tactic-report/
          retention-days: 30

  country-matrix:
    needs: regression
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: short
          - id: medium
          - id: long
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .cache/ai-resources/cdn
          key: ai-resources-541828fa-${{ hashFiles('ts-redalert2/deploy/prepare-resources.ts') }}
      - name: Prepare resources and dependencies
        run: |
          command -v 7z >/dev/null || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
          cd ts-redalert2
          bun install --frozen-lockfile
          cd ..
          bash .github/scripts/prepare-ai-resources.sh
      - name: Real country matches
        working-directory: ts-redalert2
        env:
          AI_SHARD: ${{ matrix.id }}
        run: |
          AI_SCENARIO="$(python3 ../.github/scripts/ai-evaluation-scenario.py \
            --plan ../docs/ai-vanilla-evaluation-plan.json --set "$AI_EVALUATION_SET" --shard "$AI_SHARD")"
          bun e2e/ai-tournament.ts --candidate-ref "$AI_CANDIDATE_REF" --baseline-ref "$AI_BASELINE_REF" \
            --baseline-profile "$AI_BASELINE_PROFILE" \
            --scenarios "$AI_SCENARIO" --concurrency "$AI_TOURNAMENT_WORKERS" --out ".artifacts/ai-ci/country-$AI_SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-country-${{ matrix.id }}
          path: ts-redalert2/.artifacts/ai-ci/country-${{ matrix.id }}/
          retention-days: 14

  report:
    needs: country-matrix
    if: always() && needs.country-matrix.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-country-*
          path: collected
      - name: Verify complete matrix and strength thresholds
        run: |
          ai_report_exit=0
          if [ "$AI_COMPARISON_MODE" = direct ]; then
            python .github/scripts/summarize-ai-matrix.py collected ai-report || ai_report_exit=$?
            if [ "$ai_report_exit" = 0 ]; then
              python .github/scripts/summarize-ai-direct.py ai-report || ai_report_exit=$?
            fi
          else
            python .github/scripts/summarize-ai-matrix.py collected ai-report \
              --minimum-win-rate 0.8 --minimum-country-win-rate 0.7 --minimum-map-win-rate 0.7 || ai_report_exit=$?
          fi
          if [ -f ai-report/report.md ]; then
            cat ai-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$ai_report_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-country-report
          path: ai-report/
          retention-days: 30
