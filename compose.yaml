name: ra2web
services:
  game:
    build:
      context: .
    image: ra2web:local
    ports:
      - "${RA2WEB_BIND:-0.0.0.0}:${RA2WEB_PORT:-8080}:8080"
    environment:
      AUTO_DOWNLOAD_ASSETS: "${RA2WEB_AUTO_DOWNLOAD_ASSETS:-true}"
      GAME_FILES_DIR: /game-files
      PUBLIC_ORIGIN: "${RA2WEB_PUBLIC_ORIGIN:-}"
    volumes:
      - game-data:/data
      - ./game-files:/game-files:ro
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  game-data:
